# Builds and deploys the JOCKY website to GitHub Pages.
#
# Place this file at .github/workflows/website.yml in the jocky repository,
# with the site itself in the website/ folder.
#
# Rebuilds when:
#   - anything in docs/ or website/ changes on main  -> docs pages, index and search update
#   - a release is published, edited or deleted      -> news + downloads update
#   - every 6 hours, to catch binaries uploaded after a release was published
#   - you run it manually from the Actions tab

name: Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/website.yml"
  release:
    types: [published, edited, deleted]
  # Safety net: GitHub sends no event when binaries are uploaded to a release
  # after it was published, so rebuild every 6 hours to pick up late uploads.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for each docs page's "Last updated" date

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --prefix website --no-audit --no-fund

      - name: Build docs pages, docs index, search index and releases
        run: node website/scripts/build-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_DIR: docs
          DOCS_REPO_PATH: docs
          DOCS_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_DIR: website

      - name: Remove build-only files from the published site
        run: rm -rf website/node_modules website/scripts website/package.json website/package-lock.json website/PUBLISHING.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Keep the repository's Deployments list tidy: after a successful deploy,
  # delete every older github-pages deployment so only the live one remains.
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Keep only the latest github-pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The API lists deployments newest first; skip the first (live) one.
          ids=$(gh api --paginate "repos/$REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' | tail -n +2)
          for id in $ids; do
            # A deployment must be marked inactive before it can be deleted.
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "repos/$REPO/deployments/$id" > /dev/null && echo "Deleted old deployment $id"
          done
